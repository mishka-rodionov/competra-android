#AppMetrica
appmetrica-analytics = { module = "io.appmetrica.analytics:analytics", version.ref = "appmetrica" }

#Jsoup
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoupVersion" }

#Vico
vico-compose = { module = "com.patrykandpatrick.vico:compose", version.ref = "vico" }

#Lifecycle
lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version.ref = "lifecycle-extensions" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleRuntimeKtx" }

#Chucker
chucker-library = { module = "com.github.chuckerteam.chucker:library", version.ref = "chuckerVersion" }
library-no-op = { module = "com.github.chuckerteam.chucker:library-no-op", version.ref = "chuckerVersion" }

#Paging
androidx-paging-runtime = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }

[plugins]
android = { id = "org.jetbrains.kotlin.android", version.ref = "android-koltin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "android-koltin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "android-koltin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
